project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - paper.qmd
    - guide.qmd
    - validation.qmd
    - pipeline.qmd
    - recomputation.md
  resources:
    - pipeline-viz/**
    - artifacts/**
    - metric-help.js

website:
  title: "Text safety transfer risk"
  description: "A saved-data audit of CKA-guided surrogate selection and classifier prediction changes against a public prompt-injection detector."
  site-url: "https://turn1a.github.io/safety-classifier-transfer-risk/"
  repo-url: "https://github.com/turn1a/safety-classifier-transfer-risk"
  repo-subdir: docs
  repo-actions: [source]
  open-graph: true
  twitter-card: true
  reader-mode: true
  navbar:
    background: "#ffffff"
    foreground: "#243746"
    left:
      - href: index.qmd
        text: Overview
      - href: paper.qmd
        text: Paper
      - href: guide.qmd
        text: Study guide
      - href: validation.qmd
        text: Validity checks
      - href: pipeline.qmd
        text: Implementation
      - href: recomputation.md
        text: Recomputation
    right:
      - icon: github
        href: https://github.com/turn1a/safety-classifier-transfer-risk
        aria-label: GitHub
  page-footer:
    left: "MIT licensed. Built with Kedro and Quarto."
    right: "[Source](https://github.com/turn1a/safety-classifier-transfer-risk) · © 2026 [Aspen Hazel Olszewska](https://github.com/turn1a)"

format:
  html:
    theme: cosmo
    css: site.css
    toc: true
    code-copy: true
    code-overflow: wrap
    lightbox: true
    include-after-body: _includes/metric-help.html

# Rendering reads site source, figures, and catalog-generated public artifacts. It does not execute
# model, attack, cloud, or data-collection work.
execute:
  freeze: auto
