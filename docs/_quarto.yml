project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - paper.qmd
    - pipeline.qmd
  resources:
    - pipeline-viz/**
    - artifacts/**

website:
  title: "Text Safety Transfer Risk"
  description: "A reproducible study of CKA-guided surrogate selection and adversarial transfer against a public prompt-injection detector."
  site-url: "https://turn1a.github.io/safety-classifier-transfer-risk/"
  repo-url: "https://github.com/turn1a/safety-classifier-transfer-risk"
  repo-subdir: docs
  repo-actions: [source]
  open-graph: true
  twitter-card: true
  reader-mode: true
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - href: paper.qmd
        text: Paper
      - href: pipeline.qmd
        text: Implementation
    right:
      - icon: github
        href: https://github.com/turn1a/safety-classifier-transfer-risk
        aria-label: GitHub
  page-footer:
    left: "MIT licensed. Built with Kedro and Quarto."
    right: "[Source](https://github.com/turn1a/safety-classifier-transfer-risk) · © 2026 Aspen Hazel Olszewska"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    code-copy: true
    code-overflow: wrap

# Rendering reads site source, figures, and catalog-generated public artifacts. It does not execute
# model, attack, cloud, or data-collection work.
execute:
  freeze: auto
