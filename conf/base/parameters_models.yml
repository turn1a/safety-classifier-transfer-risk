# Models stage. Adding a transformer surrogate requires a {name, kind} entry here and a matching hub.{name} source in catalog.yml. The catalog records the Hub repository identifier. The BiLSTM has no Hub source.
#
# kind:
#   pretrained: Materialize an existing classifier from its Hub source.
#   finetune: Load a base backbone with num_labels: 2 and fine-tune it on the canonical task.
#   bilstm: Train the non-transformer comparator from scratch.
#
# victim: onnx selects the exported ONNX graph for source attacks. The default uses the Torch checkpoint. The ARM64 cloud run encountered "MatMul dimension mismatch" errors in fused ONNX attention nodes for DeBERTa and the standard BERT, RoBERTa, and ELECTRA graphs. Verify the ONNX backend on the execution platform before selecting it. Graphs are exported with either backend; CKA extraction is unchanged.
models:
  target: protectai/deberta-v3-base-prompt-injection-v2 # provenance label; loaded via target_model
  surrogates:
    - name: deberta-base-pi-v1
      kind: pretrained
    # Gated: request access on its HF page before running (needs HF_TOKEN).
    - name: deberta-small-pi-v2
      kind: pretrained
      gated: true
    - name: deepset-deberta-injection
      kind: pretrained
    - name: llama-prompt-guard-86m
      kind: pretrained
      gated: true
    - name: llama-prompt-guard-22m
      kind: pretrained
      gated: true
    - name: bert-base-ft
      kind: finetune
    - name: roberta-base-ft
      kind: finetune
    - name: electra-small-ft
      kind: finetune
    # Shares the target's DeBERTa-v3-base backbone; similarity is measured on the probe.
    - name: deberta-base-ft-seed
      kind: finetune
    # Non-transformer comparator trained from scratch.
    - name: bilstm-attention
      kind: bilstm
  finetune:
    lr: 2.0e-5
    batch_size: 32
    epochs: 3
    max_seq_len: 512 # train + ONNX-trace at the full window the sweep attacks over
  bilstm:
    # Historical checkpoints without this field retain legacy_unmasked behavior on load.
    padding_policy: masked
    embed_dim: 128
    hidden_dim: 256
    num_layers: 2
    dropout: 0.3
    lr: 1.0e-3
    batch_size: 64
    epochs: 5
    max_vocab: 20000
    max_seq_len: 512 # BiLSTM trained + attacked at the same window (its wrapper reads this from config)
